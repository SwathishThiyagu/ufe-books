name: DeepSeek balance
# Prints the DeepSeek account balance (no tokens used). Run by hand before starting a batch of books.
on: workflow_dispatch
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://api.deepseek.com/user/balance -H "Authorization: Bearer $KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('available:', d.get('is_available')); [print(b['currency'], 'total', b['total_balance'], 'topped up', b['topped_up_balance'], 'granted', b['granted_balance']) for b in d.get('balance_infos', [])]"
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
