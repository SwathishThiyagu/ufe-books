name: Lesson writer (DeepSeek)
# Fills a lesson file in pipeline/lessons/sample/ with DeepSeek and runs the lesson check; pushes the result to lesson/sample.
on:
  push:
    branches: [main]
    paths: ["pipeline/lessons/request.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fill the lesson
        env:
          OPENAI_BASE_URL: https://api.deepseek.com
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_MODEL: deepseek-flash
          MAX_TOKENS: "60000"
        run: |
          for f in $(grep -v '^#' pipeline/lessons/request.txt); do python pipeline/lessons/fill_lesson.py "pipeline/lessons/sample/$f" --rounds 4 || true; done
          git config user.name ufe-free-books; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B lesson/sample; git add -f pipeline/lessons/sample; git commit -qm "lesson sample filled" || true; git push -q -f origin lesson/sample
