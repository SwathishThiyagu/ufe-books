name: Free book writer
# Writes unit books with the free Gemini API, one branch per unit (free/<unit>-book).
# Needs the repository secret GEMINI_API_KEY. Start it from the Actions tab (Run workflow),
# or by pushing a change to pipeline/requests.txt.
on:
  workflow_dispatch:
    inputs:
      units:
        description: "Unit ids separated by spaces (leave empty to use pipeline/requests.txt)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["pipeline/requests.txt"]
  schedule:
    - cron: "47 8 * * *"   # 14:17 IST daily, just after the free quota resets (midnight Pacific)
permissions:
  contents: write
concurrency:
  group: free-books
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the render checker
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Write the books
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNITS: ${{ github.event.inputs.units }}
        run: bash pipeline/ci.sh
