<script>

/* ===== University free n easy lesson engine (the comic 'Hybrid A' renderer of the AMPK series, made reusable):
   the lesson file above defines META, SC and optionally LESSON_MASCOT(x,y,s,o) and EXTRA(R,ICON); the engine draws every scene kind. ===== */
function MASCOT(x,y,s,o){return (typeof LESSON_MASCOT==='function'?LESSON_MASCOT:ampkC)(x,y,s,o)}
const S=n=>Math.round(n*100)/100;
/* STATIC: draw the finished state with no animation at all (the sketchnote keeps earlier scenes on the board this way) */
let STATIC=false;
const g=(cls,t,inner,st='')=>{if(!STATIC&&(cls==='type'||cls==='typeR'))return `<g class="tw" style="--d:${S(t)}s;${st}"><g>${inner}</g><rect class="twc ${cls==='type'?'r':'l'}" fill="${WHT}" width="0" height="0"/></g>`;
 if(!STATIC)return `<g class="${cls}" style="--d:${S(t)}s;${st}">${inner}</g>`;
 if(/\b(hideAt|out)\b/.test(cls))return '';
 const m=/--dx:([-\d.]+)px;--dy:([-\d.]+)px/.exec(st);if(/\bmv\b/.test(cls)&&m)return `<g transform="translate(${m[1]} ${m[2]})">${inner}</g>`;
 const r=/--a:([-\d.]+)deg;--ox:([-\d.]+)px;--oy:([-\d.]+)px/.exec(st);if(/\brot\b/.test(cls)&&r)return `<g transform="rotate(${r[1]} ${r[2]} ${r[3]})">${inner}</g>`;
 return /\bdim\b/.test(cls)?`<g opacity=".35">${inner}</g>`:`<g>${inner}</g>`};
const at=(x,y,inner,r=0,s=1)=>`<g transform="translate(${S(x)} ${S(y)})${r?` rotate(${S(r)})`:''}${s!==1?` scale(${S(s)})`:''}">${inner}</g>`;
const swap=(t0,t1,inner,cls='pop')=>t1==null?g(cls,t0,inner):g('hideAt',t1,g(cls,t0,inner));
const MV=(t,inner,dx,dy,n=.9)=>g('mv',t,inner,`--dx:${S(dx)}px;--dy:${S(dy)}px;--n:${n}s`);
const MVIN=(t,inner,dx,dy,n=.7)=>g('mvIn',t,inner,`--dx:${S(dx)}px;--dy:${S(dy)}px;--n:${n}s`);
const ROT=(t,inner,a,ox,oy,n=.9)=>g('rot',t,inner,`--a:${a}deg;--ox:${S(ox)}px;--oy:${S(oy)}px;--n:${n}s`);
const fmt=n=>n.toLocaleString('en-US');
/* deterministic jitter so hand-made shapes look the same on every frame */
const rnd=(i,k=1)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x)};
/* small base sequence for drawn DNA */
const SEQ='TACGGATCCTGAAGCTTACG', COMP={A:'T',T:'A',G:'C',C:'G'};

/* ===== Hybrid A · AMPK series in Version 1's look (Version 2's pages and story, Version 1's colour, material and finish) =====
   One bold change: the lesson is a comic book. No picture box beside a text column: every word lives inside the art
   (caption boxes, speech bubbles, sound effects), each scene is a page of panels, and a new chapter turns the page.
   Canvas: one 1600 x 900 SVG per scene. Fonts: Bangers (titles, sound effects), Shantell Sans (lettering). */
const INK='#18213A',PAP='#F7F5F0',WHT='#FFFFFF',YEL='#FAB005',RED='#E03131',BLU='#4C6EF5',CYN='#0CA678',MAG='#E64980',GRN='#2F9E44',ORG='#F76707',PUR='#7950F2',SKY='#D9E3FF',GRY='#ADB5BD',DIM='#EEF0F4',NIGHT='#18213A';
const SECC={0:RED,1:CYN,2:MAG,3:ORG,4:GRN,5:BLU,7:YEL};
const BASES={A:ORG,T:YEL,G:GRN,C:PUR};
const LF="'Nunito Sans','Noto Sans Math',Arial,sans-serif", BF="Rubik,'Nunito Sans','Noto Sans Math',Arial,sans-serif";
const up=s=>s;   // Version 1 letters in sentence case
const twB=(s,fs)=>s.replace(/<[^>]+>/g,'').length*fs*.46, twL=(s,fs)=>s.replace(/<[^>]+>/g,'').length*fs*.66;
/* ---------- lettering ---------- */
function bang(x,y,s,o={}){const fs=o.fs||80,fill=o.fill||YEL,sw=o.sw??Math.max(4,fs*.1),a=o.a||'middle',r=o.r||0,sh=o.sh??Math.round(fs*.06),ls=o.ls??1;

   right. The build pads the audio to match. ---------- */

    while the timeline moves (a converter that samples the page between frame(t) calls still sees them move) and hold still when paused */

  if(st)st.classList.toggle('logo-on',!!on);svg.style.display=(typeof META!=='undefined'&&META.brand===false)?'none':''}
 return{at,DUR_IN:0,DUR_OUT,INTRO}})();
</script>
<script>
/* ---------- clock: the voice drives every frame; __frame(t) renders any moment, so preview == video ---------- */
(function(){
const params=new URLSearchParams(location.search), RENDER=params.has('render');
if(RENDER) document.body.classList.add('render');
const layer=document.getElementById('layer'), stage=document.getElementById('stage'), ccEl=document.getElementById('cc');

document.title=document.title||META.title;
const L=DATA.lines, TOTAL=window.EPISODE_DATA.total;
const START=window.EPISODE_DATA.scenes.map(s=>s.start);
const END=START.map((s,i)=>i<START.length-1?START[i+1]:TOTAL);window.__END=END;
window.__T=START; window.__TOTAL=TOTAL; window.__VIDEO_DURATION__=TOTAL;
const NP=META.parts.length, RCi=NP+1, QZi=NP+2, LSi=NP+3, OUTi=NP+4;
const secTheme=s=>s===0||s===OUTi?'warm':s===RCi?'deep':s===QZi?'dark':'light';
const modeOf=sc=>sc.board?'board':(sc.m||'iso');
window.__MODES=SC.map(modeOf);
const norm=w=>w.toLowerCase().replace(/[^a-z0-9'-]/g,'');
const lineOf=i=>L[SC[i].line??i];
function cueTime(i,phrase){const ws=lineOf(i).words, toks=phrase.split(/\s+/).map(norm).filter(Boolean);for(let k=0;k<ws.length;k++){let ok=true;for(let j=0;j<toks.length;j++){const w=ws[k+j]?norm(ws[k+j][0]):'';if(j===toks.length-1?!w.startsWith(toks[j]):w!==toks[j]){ok=false;break}}if(ok)return Math.max(0,ws[k][1]-START[i]-0.05)}console.warn('cue not found',i+1,phrase);return 1}
const CUE=SC.map((sc,i)=>{const c={end:END[i]-START[i]};for(const k in sc.cues)c[k]=cueTime(i,sc.cues[k]);return c});window.__CUE=CUE;
window.__CUEFAIL=[];SC.forEach((sc,i)=>{for(const k in sc.cues){const ws=lineOf(i).words.map(w=>norm(w[0])).join(' ');if(!ws.includes(norm(sc.cues[k].split(/\s+/)[0])))window.__CUEFAIL.push([i+1,k,sc.cues[k]])}});
let cur=-1, anims=[], prevAnims=[], prevDur=0, prevEl=null, prevTx=[];
const sceneAt=t=>{let i=0;while(i<SC.length-1&&t>=START[i+1])i++;return i};
function dots(s){if(s<1||s>NP)return '';return `<div class="dots">${META.parts.map((p,k)=>`<i class="${k+1<s?'done':k+1===s?'on':''}"></i>`).join('')}</div>`}
function sceneHTML(i,cls){return TPL.scene(i,cls,CUE[i],CUE)}
/* scene i goes on top of scene i-1/* scene i goes on top of scene i-1 held at its last frame, so a change is a crossfade, never a blank or a flash */
function build(i){const sc=SC[i],prev=i>0?SC[i-1]:null,section=!!prev&&prev.s!==sc.s;
  layer.innerHTML=(prev?sceneHTML(i-1,'prev'):'')+sceneHTML(i,'now '+(section?'reveal':'xfade'));
  layer.querySelectorAll('rect.twc').forEach(r=>{const b=r.previousElementSibling.getBBox();r.setAttribute('x',S(b.x-3));r.setAttribute('y',S(b.y-3));r.setAttribute('width',S(b.width+6));r.setAttribute('height',S(b.height+6))});
  prevEl=layer.querySelector('.scene.prev');const nowEl=layer.querySelector('.scene.now');prevTx=[];
  /* keyed text (data-k): identical text stays put; changed text fades out fast while the new text rises in, so nothing ghosts */
  nowEl.querySelectorAll('[data-k]').forEach(e=>{const p=prevEl&&!section?prevEl.querySelector(`[data-k="${e.dataset.k}"]`):null;if(p&&p.innerHTML===e.innerHTML)return;e.classList.add('txIn');if(p)prevTx.push(p)});
  if(prevEl&&!section)prevEl.querySelectorAll('[data-k]').forEach(p=>{if(!nowEl.querySelector(`[data-k="${p.dataset.k}"]`))prevTx.push(p)});
  prevAnims=prevEl?prevEl.getAnimations({subtree:true}):[];anims=nowEl.getAnimations({subtree:true});
  prevAnims.forEach(a=>a.pause());anims.forEach(a=>a.pause());prevDur=prev?(END[i-1]-START[i-1])*1000:0;cur=i}
function frame(t){t=Math.max(0,Math.min(t,TOTAL-0.001));const i=sceneAt(t);if(i!==cur)build(i);const lt=(t-START[i])*1000;for(const a of anims){try{a.currentTime=lt}catch(e){}}
  for(const a of prevAnims){try{a.currentTime=prevDur+lt}catch(e){}}if(prevEl)prevEl.style.visibility=lt>1200?'hidden':'';for(const e of prevTx)e.style.opacity=Math.max(0,1-lt/220);if(TPL.after)TPL.after(i,lt,layer);
  const ln=L.find(l=>t>=l.start-.05&&t<=l.end+.3);ccEl.textContent=ln?ln.text:'';if(window.__bumper)window.__bumper.at(t);}
window.__frame=frame; window.render=build;
frame(0);
if(RENDER) return;
const $=id=>document.getElementById(id);
const audio=$('vo');
let playing=false, hasAudio=false, clock0=0, clockAt=0, started=false;
audio.addEventListener('loadedmetadata',()=>{ if(!window.__RENDER__) hasAudio=true; });
audio.addEventListener('error',()=>{ hasAudio=false; });
const fmt=s=>`${Math.floor(s/60)}:${(s%60).toFixed(2).padStart(5,'0')}`;
const now=()=>hasAudio?audio.currentTime:(playing?clockAt+(performance.now()-clock0)/1000:clockAt);
const dbg=document.createElement('div'); dbg.className='dbg'; stage.appendChild(dbg);
let dbgOn=params.has('debug'); dbg.classList.toggle('on',dbgOn);
function seek(t){t=Math.max(0,Math.min(TOTAL-0.01,t));if(hasAudio)audio.currentTime=t;clockAt=t;clock0=performance.now();frame(t)}
function play(){ if(now()>=TOTAL-0.05) seek(0); playing=true;started=true;clock0=performance.now();$('playBtn').textContent='⏸ Pause';
  if(hasAudio) audio.play().catch(()=>{ pause(); }); }
function pause(){clockAt=now();playing=false;if(hasAudio)audio.pause();$('playBtn').textContent='▶ Play'}
window.__player={play,pause,seek,now,isPlaying:()=>playing,sceneAt};
$('playBtn').onclick=()=> playing?pause():play();
$('prevBtn').onclick=()=> seek(START[Math.max(0,sceneAt(now()+0.001)-1)]+0.001);
$('nextBtn').onclick=()=> seek(START[Math.min(START.length-1,sceneAt(now()+0.001)+1)]+0.001);
$('dbgBtn').onclick=()=>{ dbgOn=!dbgOn; dbg.classList.toggle('on',dbgOn); };
$('ccBtn').onclick=()=>{ ccEl.classList.toggle('on'); };
if(params.has('cc')) ccEl.classList.add('on');
const sel=$('sceneSel'); sel.innerHTML=SC.map((s,k)=>`<option value="${k}">${k+1} · ${s.term.replace(/<[^>]+>/g,'')}</option>`).join('');
sel.onchange=()=> seek(START[+sel.value]+0.001);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if(e.code==='Space'){e.preventDefault(); $('playBtn').click();}
  else if(e.key==='ArrowRight') $('nextBtn').click();
  else if(e.key==='ArrowLeft') $('prevBtn').click();
  else if(e.key==='.') seek(now()+1/30); else if(e.key===',') seek(now()-1/30);
  else if(e.key.toLowerCase()==='d') $('dbgBtn').click();
  else if(e.key.toLowerCase()==='c') $('ccBtn').click();
});
(function loop(){const t=now(); if(t>=TOTAL&&playing) pause(); frame(t);
  const k=sceneAt(Math.min(t,TOTAL-0.001));
  $('timeLabel').textContent=`${fmt(Math.min(t,TOTAL))} / ${fmt(TOTAL)}`; if(document.activeElement!==sel) sel.value=String(k);
  if(dbgOn) dbg.textContent=`${fmt(t)} / ${fmt(TOTAL)}\nscene ${k+1}/${SC.length}  ${SC[k].term}\nlocal ${(t-START[k]).toFixed(2)} s  (scene ${(END[k]-START[k]).toFixed(2)} s)`;
  requestAnimationFrame(loop);})();
seek(params.has('t')?parseFloat(params.get('t')):0);
if(window.__RENDER__){ hasAudio=false; audio.removeAttribute('src'); document.body.classList.add('render'); seek(0); play(); return; }
const auto=()=>{ if(!started){ hasAudio=true; play(); } };
if(audio.readyState>=1) auto(); else audio.addEventListener('loadedmetadata',auto,{once:true});
})();


</script>
