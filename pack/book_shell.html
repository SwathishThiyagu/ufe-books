<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* University free n easy unit book. Fill the __PLACEHOLDERS__ and the <main> only; keep the rest of this shell as it is,
   so every book of the series reads the same way. Light and dark follow the reader's system setting. */
:root{
  --bg:#f6f7fb; --panel:#ffffff; --ink:#18203a; --muted:#5b6482; --line:#dde1ec; --line2:#b9c0d4;
  --accent:#2f3fa8; --accent-ink:#ffffff; --accent-soft:#e6e9fb; --live:#b35c00; --live-soft:#fff1df; --next:#1f7a5a; --next-soft:#e2f4ec;
  --fig:#fbfbfe; --ring:rgba(24,32,58,.18);
  --u-anna:#2a78d6; --u-srm:#eb6834; --u-iitm:#a8a8fd; --u-iitd:#7d0199; --u-iitb:#865df8; --u-nitt:#119381; --u-nitk:#55c00f; --u-nitc:#435b00; --u-manipal:#e87ba4; --u-christ:#eda100;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1322; --panel:#171c30; --ink:#e7eaf6; --muted:#9aa3c4; --line:#2a3150; --line2:#46507a;
  --accent:#9aa8ff; --accent-ink:#0f1322; --accent-soft:#232c55; --live:#ffb057; --live-soft:#3a2a12; --next:#5fd3a6; --next-soft:#123327;
  --fig:#131830; --ring:rgba(231,234,246,.22);
  --u-anna:#3987e5; --u-srm:#d95926; --u-iitm:#554de4; --u-iitd:#8f17ac; --u-iitb:#a56ffe; --u-nitt:#0a9a87; --u-nitk:#15b312; --u-nitc:#207600; --u-manipal:#d55181; --u-christ:#c98500; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1322; --panel:#171c30; --ink:#e7eaf6; --muted:#9aa3c4; --line:#2a3150; --line2:#46507a;
  --accent:#9aa8ff; --accent-ink:#0f1322; --accent-soft:#232c55; --live:#ffb057; --live-soft:#3a2a12; --next:#5fd3a6; --next-soft:#123327;
  --fig:#131830; --ring:rgba(231,234,246,.22);
  --u-anna:#3987e5; --u-srm:#d95926; --u-iitm:#554de4; --u-iitd:#8f17ac; --u-iitb:#a56ffe; --u-nitt:#0a9a87; --u-nitk:#15b312; --u-nitc:#207600; --u-manipal:#d55181; --u-christ:#c98500; color-scheme:dark }
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:72px}
html,body{background:var(--bg); color:var(--ink)}
body{margin:0; font:16px/1.65 var(--body); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:0 60px}
a{color:var(--accent)}
header.top{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding-block:10px 8px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline}
header.top .brand{font:800 15px var(--display); color:var(--ink); text-decoration:none; letter-spacing:-.01em}
header.top .crumb{font:500 12px var(--body); color:var(--muted); letter-spacing:.04em; text-transform:uppercase; min-width:0; overflow-wrap:anywhere}
header.top .right{margin-left:auto; display:flex; gap:8px; align-items:center}
.btn{font:600 12.5px var(--body); border:1px solid var(--line2); background:var(--panel); color:var(--ink); padding:5px 11px; border-radius:999px; cursor:pointer; text-decoration:none; white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hero{padding:26px 0 14px; max-width:1100px}
.hero .eyebrow{font:600 11.5px var(--body); text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-bottom:6px}
.hero h1{font:800 clamp(28px,4vw,44px)/1.08 var(--display); margin:0 0 8px; letter-spacing:-.015em; text-wrap:balance; overflow-wrap:anywhere}
.hero h1 small{display:block; font:600 clamp(16px,2vw,22px)/1.3 var(--display); color:var(--muted); margin-top:6px; letter-spacing:0}
.hero .lead{font-size:17.5px; color:var(--muted); max-width:72ch; margin:8px 0 12px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px}
.chip{display:inline-flex; align-items:center; gap:6px; font:500 12px var(--mono); padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; max-width:100%}
.chip.tier{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.chip.main{background:var(--next-soft); color:var(--next); border-color:transparent}
.wrap{display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; align-items:start; max-width:1240px}
nav.toc{position:sticky; top:62px; max-height:calc(100vh - 76px); overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:10px 0}
nav.toc .h{font:600 11px var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:6px 14px}
nav.toc a{display:flex; gap:8px; align-items:flex-start; padding:6px 14px; font-size:13.5px; color:var(--ink); text-decoration:none; border-left:3px solid transparent}
nav.toc a:hover{background:var(--accent-soft)}
nav.toc a[aria-current="true"]{border-left-color:var(--accent); background:var(--accent-soft)}
nav.toc a .n{font:500 11.5px var(--mono); color:var(--muted); flex:none; min-width:2.2em}
nav.toc a .tick{margin-left:auto; color:var(--next); font-weight:700; display:none}
nav.toc a.done .tick{display:inline}
nav.toc a.sub{font-size:12.5px; color:var(--muted); padding-left:22px}
main{min-width:0; max-width:78ch}
main p, main li{max-width:72ch}
main>section{margin:0 0 32px}
h2{font:800 clamp(22px,2.6vw,30px)/1.2 var(--display); margin:40px 0 10px; padding-top:18px; border-top:2px solid var(--line); letter-spacing:-.01em; text-wrap:balance; overflow-wrap:anywhere}
section.ch>h2 .num{display:inline-block; font:600 13px var(--mono); color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 10px; margin-right:10px; vertical-align:middle}
h3{font:700 18px/1.3 var(--display); margin:26px 0 6px}
h4{font:600 13px var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 6px}
p.lead{font-size:17px; color:var(--ink)}
.cov{display:inline-flex; gap:2px; align-items:center; vertical-align:middle}
.dot{display:inline-block; width:9px; height:9px; border-radius:2px; box-shadow:inset 0 0 0 1px var(--ring)}
.dot.off{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line2)}
.d-anna{background:var(--u-anna)} .d-srm{background:var(--u-srm)} .d-iitm{background:var(--u-iitm)} .d-iitd{background:var(--u-iitd)} .d-iitb{background:var(--u-iitb)} .d-nitt{background:var(--u-nitt)} .d-nitk{background:var(--u-nitk)} .d-nitc{background:var(--u-nitc)} .d-manipal{background:var(--u-manipal)} .d-christ{background:var(--u-christ)}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin:6px 0}
.legend span{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
.tag{font:600 10.5px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--live); background:var(--live-soft); border-radius:999px; padding:1px 7px; margin-left:6px; white-space:nowrap; vertical-align:middle}
.tablewrap{overflow-x:auto; margin:10px 0 16px}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{border-bottom:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top}
th{font:600 11px var(--body); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); white-space:nowrap}
td.mono, .mono{font-family:var(--mono); font-size:13px}
figure.fig{margin:18px 0 22px; border:1px solid var(--line); border-radius:14px; background:var(--fig); padding:14px 14px 10px; max-width:100%}
figure.fig svg{display:block; width:100%; height:auto; max-width:720px; margin:0 auto; font-family:var(--body)}
figure.fig figcaption{font-size:13.5px; color:var(--muted); margin-top:8px; max-width:72ch}
figure.fig figcaption b{color:var(--ink)}
.example, .traps, .beyond, .quiz, .prereq, .keybox{border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:18px 0; background:var(--panel)}
.example{border-left:4px solid var(--accent)}
.example h4{color:var(--accent)}
.traps{border-left:4px solid var(--live)}
.traps h4{color:var(--live)}
.beyond{border-left:4px solid var(--next); background:var(--next-soft)}
.beyond h4{color:var(--next)}
.prereq{background:var(--bg); font-size:14px}
.keybox{background:var(--accent-soft)}
.steps{counter-reset:s; padding-left:0; list-style:none}
.steps li{counter-increment:s; position:relative; padding-left:34px; margin:8px 0}
.steps li::before{content:counter(s); position:absolute; left:0; top:1px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font:600 12.5px var(--mono); display:flex; align-items:center; justify-content:center}
pre{font:13.5px/1.5 var(--mono); background:var(--fig); border:1px solid var(--line); border-radius:10px; padding:12px 14px; overflow-x:auto; max-width:100%}
code{font:0.92em var(--mono); background:var(--accent-soft); padding:1px 5px; border-radius:5px}
pre code{background:none; padding:0}
.quiz details{border-top:1px solid var(--line); padding:8px 0}
.quiz details:first-of-type{border-top:0}
.quiz summary{cursor:pointer; font-weight:500; list-style:none; display:flex; gap:10px; align-items:baseline}
.quiz summary::-webkit-details-marker{display:none}
.quiz summary::before{content:"+"; font:600 14px var(--mono); color:var(--muted); flex:none}
.quiz details[open]>summary::before{content:"\2212"}
.quiz .lvl{font:600 10.5px var(--mono); text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:1px 7px; flex:none}
.quiz details>*:not(summary){margin:8px 0 4px 24px; color:var(--muted); font-size:15px}
.quiz details>*:not(summary) b{color:var(--ink)}
.marks{font:500 11.5px var(--mono); color:var(--muted); margin-left:auto; flex:none}
dl.gloss{display:grid; grid-template-columns:minmax(120px,max-content) minmax(0,1fr); gap:6px 16px; margin:0}
dl.gloss dt{font-weight:600}
dl.gloss dd{margin:0; color:var(--muted)}
.read{display:flex; gap:10px; align-items:center; margin:18px 0 0; padding-top:12px; border-top:1px dashed var(--line); font-size:14px; color:var(--muted)}
.read input{width:18px; height:18px; accent-color:var(--next); margin:0}
.prog{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); margin:8px 0 0}
.prog .bar{flex:1 1 120px; height:7px; border-radius:4px; background:var(--line); overflow:hidden; max-width:240px}
.prog .bar i{display:block; height:100%; background:var(--next); width:0}
footer.foot{margin-top:40px; padding-top:14px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; max-width:78ch}
.srcs li{margin:4px 0; overflow-wrap:anywhere}
.note{font-size:14px; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:10px; font-size:14px; z-index:30}
@media (max-width:980px){ .wrap{grid-template-columns:minmax(0,1fr)} nav.toc{position:static; max-height:none; margin-bottom:8px} nav.toc .list{display:none} nav.toc.open .list{display:block} nav.toc .h{cursor:pointer} }
@media (max-width:600px){ body{font-size:15.5px} figure.fig{padding:10px 8px 8px} .example,.traps,.beyond,.quiz,.prereq,.keybox{padding:12px 12px} dl.gloss{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
@media print{ header.top, nav.toc, .read, .btn{display:none} body{padding:0; font-size:12pt} .wrap{display:block} main{max-width:none} .quiz details{break-inside:avoid} }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#top">University free n easy</a>
  <span class="crumb">__CRUMB__</span>
  <span class="right"><button class="btn" id="copylink" type="button">Copy link</button></span>
</header>

<div class="hero" id="top">
  <div class="eyebrow">__EYEBROW__</div>
  <h1>__SUBJECT__ <small>Unit __UNIT_NO__ · __UNIT_NAME__</small></h1>
  <p class="lead">__LEAD__</p>
  <div class="chips">__CHIPS__</div>
  <div class="prog" id="prog" hidden><span id="progt">0 of 0 chapters read</span><span class="bar"><i id="progi"></i></span></div>
</div>

<div class="wrap">
  <nav class="toc" aria-label="Contents"><div class="h">In this unit</div><div class="list" id="toc"></div></nav>
  <main id="main">
__MAIN__
  </main>
</div>

<footer class="foot">__FOOT__</footer>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const chapters=[...document.querySelectorAll('main section.ch')];
  const key='ufe_book_'+location.pathname.split('/').pop().replace(/\.html$/,'');
  const LS={get(){ try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; } }, set(v){ try{ localStorage.setItem(key,JSON.stringify(v)); }catch(e){} }};
  let done=new Set(LS.get());
  // contents from the chapter headings, plus the unit-level sections
  const toc=$('#toc'); let h='';
  for(const s of document.querySelectorAll('main > section')){
    const h2=s.querySelector('h2'); if(!h2||!s.id) continue;
    const num=h2.querySelector('.num'); const title=h2.textContent.replace(num?num.textContent:'','').trim();
    h+=`<a href="#${s.id}" class="${s.classList.contains('ch')?'':'sub'} ${done.has(s.id)?'done':''}" data-id="${s.id}"><span class="n">${num?num.textContent:'·'}</span><span>${title}</span><span class="tick">✓</span></a>`;
  }
  toc.innerHTML=h;
  $('nav.toc .h').addEventListener('click',()=>$('nav.toc').classList.toggle('open'));
  // read ticks at the end of each chapter
  chapters.forEach(s=>{ const r=document.createElement('label'); r.className='read';
    r.innerHTML=`<input type="checkbox" ${done.has(s.id)?'checked':''}> Mark this chapter as read`;
    r.querySelector('input').addEventListener('change',e=>{ if(e.target.checked) done.add(s.id); else done.delete(s.id); LS.set([...done]); paint(); });
    s.appendChild(r); });
  function paint(){ const n=chapters.length, d=chapters.filter(s=>done.has(s.id)).length;
    const p=$('#prog'); if(n){ p.hidden=false; $('#progt').textContent=`${d} of ${n} chapters read`; $('#progi').style.width=(100*d/n)+'%'; }
    toc.querySelectorAll('a').forEach(a=>a.classList.toggle('done',done.has(a.dataset.id))); }
  paint();
  // highlight the chapter in view
  try{ const io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ toc.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.id===e.target.id)); } }); },{rootMargin:'-20% 0px -70% 0px'});
    document.querySelectorAll('main > section[id]').forEach(s=>io.observe(s)); }catch(e){}
  $('#copylink').addEventListener('click',async()=>{ const t=location.href; let ok=false; try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){}
    const x=document.createElement('div'); x.className='toast'; x.textContent=ok?'Link copied.':'Copy did not work here; copy the address bar.'; document.body.appendChild(x); setTimeout(()=>x.remove(),2500); });
})();
</script>
</body>
</html>
